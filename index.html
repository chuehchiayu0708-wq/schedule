<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>課堂與個人待辦</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>

  <div id="custom-bg-layer"></div>
  <div id="bg-dimmer"></div>

  <header id="app-header" class="glass-panel">
    <div class="header-title-box">
      <h1>待辦清單</h1>
      <span id="sync-status">等待登入...</span>
    </div>
    <div class="header-actions">
      <button id="auth-btn" class="glass-btn" title="Google 帳號登入">🔑 登入</button>
      <button id="bg-btn" class="glass-btn" title="更換背景">🖼️ 背景</button>
      <button id="notify-btn" class="glass-btn" title="開啟提醒通知">🔔 通知</button>
      <input type="file" id="bg-file-input" accept="image/*" hidden>
    </div>
  </header>

  <nav id="filter-bar"></nav>

  <main id="todo-list-container">
    <ul id="todo-list"></ul>
  </main>

  <footer id="floating-input-wrapper" class="glass-panel">
    <form id="todo-form">
      <div class="input-top-row">
        <input type="text" id="todo-input" placeholder="新增課堂作業或待辦..." required autocomplete="off">
        <button type="submit" id="add-btn">＋</button>
      </div>
      <div class="input-meta-row">
        <select id="tag-select" class="glass-select"></select>
        <input type="datetime-local" id="due-date-input" class="glass-select" aria-label="設定到期時間">
      </div>
    </form>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
